version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-crm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm123}
      POSTGRES_DB: ${DB_NAME:-currency_crm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crm} -d ${DB_NAME:-currency_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Dev: перевизначаємо CMD з Dockerfile (build+prod) на watch-режим.
    # prisma generate — щоб Prisma client завжди збігався з актуальною схемою
    # (інакше зміни schema.prisma кладуть watch-бекенд на неузгоджених типах).
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Щоденні бекапи БД: pg_dump у ./backups (gzip), ротація BACKUP_KEEP_DAYS днів.
  # Перший бекап — одразу при старті, далі кожні 24 години.
  # Ручний бекап/відновлення: scripts/backup-db.sh
  backup:
    image: postgres:15-alpine
    restart: always
    environment:
      PGPASSWORD: ${DB_PASSWORD:-crm123}
      DB_USER: ${DB_USER:-crm}
      DB_NAME: ${DB_NAME:-currency_crm}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c 'while true; do
        f="/backups/currency_crm_$$(date +%Y%m%d_%H%M%S).sql.gz";
        if pg_dump -h db -U "$$DB_USER" "$$DB_NAME" | gzip > "$$f"; then
          echo "[backup] OK $$f ($$(du -h "$$f" | cut -f1))";
        else
          echo "[backup] FAILED $$f"; rm -f "$$f";
        fi;
        find /backups -name "currency_crm_*.sql.gz" -mtime +$$BACKUP_KEEP_DAYS -delete;
        sleep 86400;
      done'

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
